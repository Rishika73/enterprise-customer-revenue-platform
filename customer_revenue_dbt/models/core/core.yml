version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

  - name: dim_product
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

  - name: dim_date
    columns:
      - name: date_day
        data_tests:
          - not_null
          - unique

  - name: fact_transactions
    columns:
      - name: transaction_id
        data_tests:
          - not_null
          - unique

  - name: fact_product_usage
    columns:
      - name: usage_id
        data_tests:
          - not_null
          - unique

  - name: fact_support_events
    columns:
      - name: ticket_id
        data_tests:
          - not_null
          - unique
